{% extends "base.html" %}
{% block title %}Create {{ role|title }} Account{% endblock %}
{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="role-icon big">{{ '🛒' if role == 'customer' else '👩‍🌾' }}</div>
        <span class="eyebrow">{{ role|upper }} SIGN UP</span>
        <h1>Create {{ role|title }} Account</h1>

        <form method="post" class="form-grid">
            <label>Full name
                <input name="name" required>
            </label>

            <label>Main ID / Username
                <input name="username" required>
            </label>

            <label>Password
                <input type="password" name="password" required>
            </label>

            <button class="btn btn-primary full">Create Account</button>
        </form>

        <p class="switch">
            Already have an account?
            <a href="{{ url_for('login', role=role) }}">Login</a>
        </p>
    </div>
</section>
{% endblock %}
